spring.application.name=event-notificator
server.port=${NOTIFICATOR_PORT:8081}
spring.datasource.url=${NOTIFICATOR_DB_URL:jdbc:postgresql://localhost:5434/notificator}
spring.datasource.username=${NOTIFICATOR_DB_USER:postgres}
spring.datasource.password=${NOTIFICATOR_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.sign-key=${JWT_SIGN_KEY:dev-only-change-this-key-please-1234567890}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=event-notificator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
events.kafka.topic=event-changes
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
notifications.cleanup.cron=0 0 * * * *
