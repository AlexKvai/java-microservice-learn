spring.application.name=event-manager
server.port=${MANAGER_PORT:8080}
spring.datasource.url=${MANAGER_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${MANAGER_DB_USER:postgres}
spring.datasource.password=${MANAGER_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.swagger-ui.url=/openapi.yaml
jwt.lifetime=180000000
jwt.sign-key=${JWT_SIGN_KEY:dev-only-change-this-key-please-1234567890}
event.status.cron=0 * * * * *
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
events.kafka.topic=event-changes
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
